<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="星星之火">
    <meta name="theme-color" content="#FFD700">
    <title>星星之火</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 登录界面 -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-logo">⭐</div>
            <h1 class="login-title">星星之火</h1>
            <p class="login-subtitle">选择你的头像开始吧</p>
            <div class="login-children-list" id="loginChildrenList"></div>
        </div>
    </div>

    <div id="app" style="display:none;">
        <!-- 左侧常驻导航栏 -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="child-switcher" id="childSwitcher" onclick="App.openChildSwitcher()">
                    <span class="current-child-name" id="currentChildName">小朋友</span>
                    <span class="star-balance" id="sidebarStarBalance">⭐ 0</span>
                </div>
            </div>
            <ul class="nav-list">
                <li class="nav-item active" data-page="home">
                    <span class="nav-icon">📅</span>
                    <span class="nav-label">首页</span>
                </li>
                <li class="nav-item" data-page="tools">
                    <span class="nav-icon">🧰</span>
                    <span class="nav-label">学习工具</span>
                </li>
                <li class="nav-item" data-page="checkin">
                    <span class="nav-icon">🔘</span>
                    <span class="nav-label">今日打卡</span>
                </li>
                <li class="nav-item" data-page="assessment">
                    <span class="nav-icon">📝</span>
                    <span class="nav-label">知识测评</span>
                </li>
                <li class="nav-item" data-page="exam">
                    <span class="nav-icon">🏆</span>
                    <span class="nav-label">考试积星</span>
                </li>
                <li class="nav-item" data-page="mall">
                    <span class="nav-icon">🎁</span>
                    <span class="nav-label">兑换商城</span>
                </li>
                <li class="nav-item nav-item-parent" data-page="settings">
                    <span class="nav-icon">🔐</span>
                    <span class="nav-label">家长入口</span>
                </li>
            </ul>
            <div class="sidebar-footer">
                <button id="backBtn" class="sidebar-back-btn" style="display:none;">
                    <span class="back-main"><span>←</span> 返回</span>
                    <span class="back-hint">上一级</span>
                </button>
                <button class="sidebar-logout-btn" id="logoutBtn" onclick="App.logout()" title="退出登录">🚪 退出登录</button>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main id="main-content" class="main-content">
            <!-- 动态内容渲染区 -->
        </main>
    </div>

    <!-- 弹窗容器 -->
    <div id="modalContainer" class="modal-overlay" style="display:none;">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- 确认弹窗容器 -->
    <div id="confirmContainer" class="modal-overlay" style="display:none;">
        <div class="modal-content confirm-modal" id="confirmContent"></div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast" style="display:none;"></div>

    <script src="js/data.js"></script>
    <script src="js/mathData.js"></script>
    <script src="js/historyData.js"></script>
    <script src="js/pinyinData.js"></script>
    <script src="js/strokeData.js"></script>
    <script src="js/secondGrade1Data.js"></script>
    <script src="js/firstGrade2Data.js"></script>
    <script src="js/sentenceWordsData.js"></script>
    <script src="js/qaEncyclopediaData.js"></script>
    <script src="js/kantuData.js"></script>
    <script src="js/phoneticsData.js"></script>
    <script src="js/poemsData.js"></script>
    <script src="js/idiomsData.js"></script>
    <script src="js/englishSongs.js"></script>
    <script src="js/englishTextbookAudio.js"></script>
    <script src="js/focusTraining.js"></script>
    <script src="js/sudoku.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tts.js"></script>
    <script src="js/xlsx.full.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
